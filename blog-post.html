<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title id="metaTitle">Blog | Sanova Urgent Care</title>
<meta name="description" content="Read health tips and urgent care advice from Sanova Urgent Care in Tucson, AZ." id="metaDesc"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="icon" type="image/png" href="assets/favicon.png" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.post-hero{background:linear-gradient(135deg,var(--c-teal-dark),var(--c-teal));padding:clamp(3rem,7vw,5rem) 0;}
.post-hero-inner{max-width:800px;}
.post-back{display:inline-flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.7);font-size:.875rem;margin-bottom:1.5rem;text-decoration:none;transition:color .2s;}
.post-back:hover{color:#fff;}
.post-hero-tag{display:inline-block;background:rgba(255,255,255,.15);color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .85rem;border-radius:9999px;margin-bottom:1rem;}
.post-hero-title{font-family:var(--ff-serif);font-size:clamp(1.8rem,4vw,3rem);font-weight:700;color:#fff;line-height:1.15;letter-spacing:var(--ls-tight);margin-bottom:1rem;}
.post-hero-meta{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;color:rgba(255,255,255,.7);font-size:.875rem;}
.post-hero-meta span{display:flex;align-items:center;gap:.4rem;}
.post-cover{width:100%;max-width:900px;margin:0 auto;border-radius:var(--r-2xl);overflow:hidden;margin-top:-3rem;box-shadow:var(--sh-xl);position:relative;z-index:2;}
.post-cover img{width:100%;height:auto;display:block;}
.post-body{max-width:780px;margin:0 auto;padding:clamp(2.5rem,5vw,4rem) var(--px);}
.post-content{font-size:1.05rem;line-height:1.85;color:var(--c-ink-3);}
.post-content h2{font-family:var(--ff-serif);font-size:1.75rem;font-weight:700;color:var(--c-ink);margin:2.5rem 0 1rem;letter-spacing:var(--ls-snug);}
.post-content h3{font-size:1.25rem;font-weight:700;color:var(--c-ink);margin:2rem 0 .75rem;}
.post-content p{margin-bottom:1.5rem;}
.post-content ul,
.post-content ol{margin:0 0 1.5rem 1.5rem;}
.post-content li{margin-bottom:.5rem;}
.post-content a{color:var(--c-teal);text-decoration:underline;}
.post-content strong{color:var(--c-ink);font-weight:700;}
.post-content blockquote{border-left:4px solid var(--c-teal);padding:1rem 1.5rem;margin:2rem 0;background:var(--c-teal-pale);border-radius:0 var(--r-lg) var(--r-lg) 0;font-style:italic;color:var(--c-ink-3);}
.post-footer{border-top:1px solid var(--c-border);margin-top:3rem;padding-top:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.post-author{display:flex;align-items:center;gap:.85rem;}
.post-author-avatar{width:48px;height:48px;background:linear-gradient(135deg,var(--c-teal),var(--c-teal-mid));border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1rem;flex-shrink:0;}
.post-author-name{font-weight:600;color:var(--c-ink);}
.post-author-role{font-size:.8rem;color:var(--c-muted);}
.post-loading{text-align:center;padding:5rem;color:var(--c-muted);}
.post-404{text-align:center;padding:5rem;}
</style>
</head>
<body data-page="blog">
<div data-inc="partials/header.html"></div>
<main>

<div id="postLoading" class="post-loading">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 1rem;display:block;animation:spin 1s linear infinite;" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
  Loading article…
</div>

<div id="post404" class="post-404" style="display:none;">
  <h2 style="font-size:2rem;color:var(--c-ink);margin-bottom:1rem;">Post Not Found</h2>
  <p style="color:var(--c-muted);margin-bottom:2rem;">This article doesn't exist or has been removed.</p>
  <a href="blog.html" class="btn btn-primary">← Back to Blog</a>
</div>

<div id="postContent" style="display:none;">
  <!-- HERO -->
  <section class="post-hero">
    <div class="container post-hero-inner">
      <a href="blog.html" class="post-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Blog
      </a>
      <div id="postTag" class="post-hero-tag"></div>
      <h1 id="postTitle" class="post-hero-title"></h1>
      <div class="post-hero-meta">
        <span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span id="postAuthor"></span>
        </span>
        <span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="postDate"></span>
        </span>
      </div>
    </div>
  </section>

  <!-- COVER IMAGE (if any) -->
  <div id="postCoverWrap" style="display:none;" class="container" style="padding-top:0;">
    <div class="post-cover"><img id="postCoverImg" src="" alt=""/></div>
  </div>

  <!-- BODY -->
  <div class="post-body">
    <div id="postBody" class="post-content"></div>

    <!-- Author + CTA -->
    <div class="post-footer">
      <div class="post-author">
        <div class="post-author-avatar" id="postAvatarLetter"></div>
        <div>
          <div class="post-author-name" id="postAuthorFoot"></div>
          <div class="post-author-role">Sanova Medical Team</div>
        </div>
      </div>
      <a href="tel:5202322525" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:16px;height:16px;"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/></svg>
        Questions? Call 520-232-2525
      </a>
    </div>
  </div>
</div>

<!-- CTA -->
<section class="section cta-section">
  <div class="container cta-inner section-sm" style="padding-block:clamp(3rem,6vw,5rem);">
    <h2 class="cta-title">Walk In Today — <em>No Appointment Needed</em></h2>
    <p class="cta-sub">Mon–Sat, 7AM–7PM · 15883 N Oracle Rd, Tucson, AZ</p>
    <div class="cta-btns">
      <a href="tel:5202322525" class="btn btn-accent btn-lg">Call 520-232-2525</a>
      <a href="contact.html" class="btn btn-outline-white btn-lg">Get Directions</a>
    </div>
  </div>
</section>

</main>
<div data-inc="partials/faq.html"></div>
<div data-inc="partials/footer.html"></div>
<script src="js/main.js"></script>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
(function(){
  const SUPABASE_URL='https://fogkdxevecwnqbmezdnu.supabase.co';
  const SUPABASE_KEY='sb_publishable_JVJjN0WRgFOJSWSIQTQsIA_sFr8EJVO';
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const slug=new URLSearchParams(location.search).get('slug');

  if(!slug){
    document.getElementById('postLoading').style.display='none';
    document.getElementById('post404').style.display='block';
    return;
  }

  async function load(){
    const {data,error}=await sb
      .from('posts')
      .select('*')
      .eq('slug',slug)
      .eq('status','published')
      .single();

    document.getElementById('postLoading').style.display='none';

    if(error||!data){
      document.getElementById('post404').style.display='block';
      return;
    }

    // Meta
    document.getElementById('metaTitle').textContent=data.title+' | Sanova Urgent Care';
    document.getElementById('metaDesc').content=data.excerpt||'';

    // Hero
    document.getElementById('postTag').textContent=data.category||'Health Tips';
    document.getElementById('postTitle').textContent=data.title;
    document.getElementById('postAuthor').textContent=data.author||'Sanova Medical Team';
    document.getElementById('postDate').textContent=new Date(data.published_at||data.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

    // Cover image
    if(data.cover_image){
      document.getElementById('postCoverImg').src=data.cover_image;
      document.getElementById('postCoverImg').alt=data.title;
      document.getElementById('postCoverWrap').style.display='block';
    }

    // Body
    document.getElementById('postBody').innerHTML=data.content||'';

    // Author footer
    const author=data.author||'Sanova Medical Team';
    document.getElementById('postAuthorFoot').textContent=author;
    document.getElementById('postAvatarLetter').textContent=author.charAt(0).toUpperCase();

    document.getElementById('postContent').style.display='block';
  }

  load();
})();
</script>
</body>
</html>
