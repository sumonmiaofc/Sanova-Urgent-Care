<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard | Sanova Blog Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>

<!-- Sidebar -->
<div id="sidebarMount"></div>

<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-sub">Welcome back! Here's what's happening with your blog.</div>
    </div>
    <div class="topbar-actions">
      <a href="/admin/create-blog" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New Post
      </a>
    </div>
  </div>

  <div class="page-body">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon si-teal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
        </div>
        <div>
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">Total Posts</div>
          <div class="stat-change stat-up" id="statTotalSub"></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="stat-num" id="statPub">—</div>
          <div class="stat-label">Published</div>
          <div class="stat-change" id="statPubSub"></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-amber">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div>
          <div class="stat-num" id="statDraft">—</div>
          <div class="stat-label">Drafts</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div>
          <div class="stat-num" id="statViews">—</div>
          <div class="stat-label">Total Views</div>
          <div class="stat-change stat-up" id="statViewsSub"></div>
        </div>
      </div>
    </div>

    <!-- Charts + Recent -->
    <div style="display:grid;grid-template-columns:1fr 340px;gap:1.5rem;margin-bottom:1.5rem;">

      <!-- Views chart -->
      <div class="card">
        <div class="card-header">
          <h3>Blog Views — Last 30 Days</h3>
          <span id="chartTotal" style="font-size:.82rem;color:#64788a;"></span>
        </div>
        <div class="card-body">
          <div class="chart-area"><canvas id="viewsChart"></canvas></div>
        </div>
      </div>

      <!-- Top posts -->
      <div class="card">
        <div class="card-header"><h3>Top Posts</h3></div>
        <div id="topPosts" style="padding:.5rem 0;">
          <div style="padding:2rem;text-align:center;"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Recent posts table -->
    <div class="card">
      <div class="card-header">
        <h3>Recent Posts</h3>
        <a href="blogs.html" class="btn btn-outline btn-sm">View All →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Post</th>
              <th>Category</th>
              <th>Status</th>
              <th>Views</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="recentTable">
            <tr><td colspan="6" style="text-align:center;padding:2rem;"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../js/config.js"></script>
<script>
(async()=>{
  const session=await requireAuth();
  if(!session)return;

  // Load sidebar
  const r=await fetch('sidebar.html');
  document.getElementById('sidebarMount').innerHTML=await r.text();
  document.querySelectorAll('.nav-link[data-page="dashboard"]').forEach(l=>l.classList.add('active'));
  document.getElementById('sbEmail').textContent=session.user.email;
  document.getElementById('sbAvatar').textContent=session.user.email.charAt(0).toUpperCase();

  // Load data
  const [blogsRes, analyticsRes]=await Promise.all([
    sb.from('blogs').select('id,title,slug,published,views,created_at,categories(name)').order('created_at',{ascending:false}),
    sb.from('analytics').select('views,created_at').gte('created_at',new Date(Date.now()-30*86400000).toISOString())
  ]);

  const blogs=blogsRes.data||[];
  const analytics=analyticsRes.data||[];

  // Stats
  const pub=blogs.filter(b=>b.published).length;
  const draft=blogs.length-pub;
  const totalViews=blogs.reduce((a,b)=>a+(b.views||0),0);
  document.getElementById('statTotal').textContent=blogs.length;
  document.getElementById('statPub').textContent=pub;
  document.getElementById('statDraft').textContent=draft;
  document.getElementById('statViews').textContent=totalViews.toLocaleString();
  document.getElementById('nbPosts').textContent=blogs.length;

  // Chart — daily views for last 30 days
  const days=30;
  const labels=[],data=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    labels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    const dayStr=d.toISOString().slice(0,10);
    data.push(analytics.filter(a=>a.created_at.slice(0,10)===dayStr).reduce((s,a)=>s+(a.views||0),0));
  }
  const ctx=document.getElementById('viewsChart').getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,220);
  grad.addColorStop(0,'rgba(13,110,122,.3)');
  grad.addColorStop(1,'rgba(13,110,122,0)');
  new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{label:'Views',data,borderColor:'#0d6e7a',backgroundColor:grad,borderWidth:2.5,tension:.4,pointRadius:3,pointBackgroundColor:'#0d6e7a',fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f0f4f8'},ticks:{color:'#94a3b8',font:{size:11}}},x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:7}}}}
  });
  const total=data.reduce((a,b)=>a+b,0);
  document.getElementById('chartTotal').textContent=total?`${total.toLocaleString()} views this month`:'No views yet';

  // Top posts
  const top=[...blogs].filter(b=>b.published).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
  document.getElementById('topPosts').innerHTML=top.length?top.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:.85rem;padding:.85rem 1.25rem;border-bottom:1px solid #f0f4f8;">
      <div style="width:24px;height:24px;background:${i===0?'#0d6e7a':i===1?'#1d4ed8':'#e2eaee'};color:${i<2?'#fff':'#64788a'};border-radius:6px;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex-shrink:0;">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.82rem;font-weight:600;color:#0f1923;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.title}</div>
        <div style="font-size:.72rem;color:#64788a;">${p.categories?.name||'—'}</div>
      </div>
      <div style="font-size:.82rem;font-weight:700;color:#0d6e7a;white-space:nowrap;">${(p.views||0).toLocaleString()} views</div>
    </div>`).join(''):'<div style="padding:2rem;text-align:center;color:#64788a;font-size:.875rem;">No published posts yet</div>';

  // Recent table
  const recent=blogs.slice(0,8);
  document.getElementById('recentTable').innerHTML=recent.length?recent.map(p=>`
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:.85rem;">
          <div class="post-thumb-placeholder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d6e7a" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg></div>
          <div class="post-title-cell">${p.title}<small>/${p.slug}</small></div>
        </div>
      </td>
      <td style="color:#64788a;font-size:.82rem;">${p.categories?.name||'—'}</td>
      <td><span class="badge badge-${p.published?'published':'draft'}"><span class="badge-dot"></span>${p.published?'Published':'Draft'}</span></td>
      <td style="font-weight:600;color:#0d6e7a;">${(p.views||0).toLocaleString()}</td>
      <td style="color:#64788a;font-size:.82rem;">${fmtDateShort(p.created_at)}</td>
      <td>
        <div style="display:flex;gap:.5rem;">
          <a href="create-blog.html?id=${p.id}" class="btn btn-outline btn-sm">Edit</a>
        </div>
      </td>
    </tr>`).join(''):'<tr><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg><h3>No posts yet</h3><p>Create your first blog post</p></div></td></tr>';

})();

async function doLogout(){await sb.auth.signOut();location.href='/admin';}
</script>
</body>
</html>
