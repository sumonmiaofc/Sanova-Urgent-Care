<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login | Sanova Blog</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.1);}
  .logo{text-align:center;margin-bottom:2rem;}
  .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,#073f47,#0d6e7a);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:.75rem;}
  .logo-icon svg{width:26px;height:26px;color:#fff;}
  .logo h1{font-size:1.4rem;font-weight:700;color:#0f1923;}
  .logo p{font-size:.85rem;color:#64788a;margin-top:.25rem;}
  label{display:block;font-size:.85rem;font-weight:600;color:#1e2d3a;margin-bottom:.4rem;}
  input{width:100%;padding:.85rem 1rem;border:1.5px solid #e2eaee;border-radius:8px;font-size:1rem;margin-bottom:1.25rem;outline:none;transition:border-color .2s;}
  input:focus{border-color:#0d6e7a;box-shadow:0 0 0 3px rgba(13,110,122,.1);}
  button{width:100%;padding:1rem;background:linear-gradient(135deg,#073f47,#0d6e7a);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
  button:hover{opacity:.9;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:.75rem 1rem;border-radius:8px;font-size:.875rem;margin-bottom:1rem;display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg>
    </div>
    <h1>Sanova Admin</h1>
    <p>Blog Management Dashboard</p>
  </div>
  <div class="error" id="errMsg"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@sanovaucc.com" autocomplete="email"/>
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
  <button id="loginBtn" onclick="doLogin()">Sign In</button>
</div>

<script>
const SUPABASE_URL = 'https://fogkdxevecwnqbmezdnu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZ2tkeGV2ZWN3bnFibWV6ZG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NDg0NzgsImV4cCI6MjA4NTUyNDQ3OH0.Gy8nDxKZFvPHrp2-r7bQILCn-zl0QmH5bb52tIVDOv0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Already logged in? redirect
sb.auth.getSession().then(({data:{session}})=>{ if(session) location.href='/admin/dashboard.html'; });

async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errMsg');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  err.style.display='none';
  if(!email||!password){err.textContent='Please fill in all fields.';err.style.display='block';return;}
  btn.disabled=true; btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){
    err.textContent=error.message;
    err.style.display='block';
    btn.disabled=false; btn.textContent='Sign In';
  } else {
    location.href='dashboard.html';
  }
}

document.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
