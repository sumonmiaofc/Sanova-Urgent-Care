<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard | Sanova Blog Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e2d3a;}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:linear-gradient(180deg,#073f47,#0d6e7a);padding:1.5rem;display:flex;flex-direction:column;z-index:10;}
.sb-logo{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.15);}
.sb-logo-icon{width:38px;height:38px;background:rgba(255,255,255,.15);border-radius:10px;display:grid;place-items:center;}
.sb-logo-icon svg{width:20px;height:20px;color:#fff;}
.sb-logo-text .name{font-weight:700;color:#fff;font-size:1.05rem;}
.sb-logo-text .sub{font-size:.7rem;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;}
.sb-nav{display:flex;flex-direction:column;gap:.35rem;flex:1;}
.sb-link{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:8px;color:rgba(255,255,255,.75);font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;}
.sb-link:hover,.sb-link.active{background:rgba(255,255,255,.15);color:#fff;}
.sb-link svg{width:18px;height:18px;flex-shrink:0;}
.sb-bottom{border-top:1px solid rgba(255,255,255,.15);padding-top:1rem;}
.sb-user{font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:.75rem;}
.sb-user strong{color:rgba(255,255,255,.9);display:block;}
.sb-logout{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.6);font-size:.85rem;cursor:pointer;padding:.5rem 0;background:none;border:none;transition:color .2s;}
.sb-logout:hover{color:#fff;}

.main{margin-left:240px;padding:2rem;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.topbar h2{font-size:1.5rem;font-weight:700;color:#0f1923;}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,#073f47,#0d6e7a);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-sm{padding:.45rem .9rem;font-size:.8rem;}
.btn-outline{background:#fff;border:1.5px solid #e2eaee;color:#1e2d3a;}
.btn-outline:hover{border-color:#0d6e7a;color:#0d6e7a;}
.btn-danger{background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;}
.btn-danger:hover{background:#dc2626;color:#fff;}
.btn-success{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;}
.btn-success:hover{background:#15803d;color:#fff;}
.btn-warn{background:#fefce8;border:1.5px solid #fde68a;color:#a16207;}
.btn-warn:hover{background:#a16207;color:#fff;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;padding:1.5rem;border:1px solid #e2eaee;}
.stat-card .num{font-size:2rem;font-weight:700;color:#0d6e7a;}
.stat-card .lbl{font-size:.8rem;color:#64788a;margin-top:.25rem;text-transform:uppercase;letter-spacing:.08em;}

/* Table */
.table-card{background:#fff;border-radius:12px;border:1px solid #e2eaee;overflow:hidden;}
.table-head{padding:1.25rem 1.5rem;border-bottom:1px solid #e2eaee;display:flex;align-items:center;justify-content:space-between;}
.table-head h3{font-size:1rem;font-weight:600;}
.search-input{padding:.6rem 1rem;border:1.5px solid #e2eaee;border-radius:8px;font-size:.875rem;width:240px;outline:none;}
.search-input:focus{border-color:#0d6e7a;}
table{width:100%;border-collapse:collapse;}
th{padding:1rem 1.5rem;text-align:left;font-size:.75rem;font-weight:600;color:#64788a;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #e2eaee;background:#f7fafc;}
td{padding:1rem 1.5rem;border-bottom:1px solid #f0f4f8;font-size:.9rem;vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:#f7fafc;}
.badge{display:inline-block;padding:.25rem .75rem;border-radius:9999px;font-size:.72rem;font-weight:600;letter-spacing:.04em;}
.badge-published{background:#dcfce7;color:#15803d;}
.badge-draft{background:#fef9c3;color:#a16207;}
.post-title{font-weight:600;color:#0f1923;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post-date{color:#64788a;font-size:.82rem;}
.actions{display:flex;gap:.5rem;align-items:center;}
.empty{padding:3rem;text-align:center;color:#64788a;}
.empty svg{width:48px;height:48px;color:#cbd5e1;margin:0 auto 1rem;}
.loading{padding:3rem;text-align:center;color:#64788a;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg>
    </div>
    <div class="sb-logo-text">
      <div class="name">Sanova</div>
      <div class="sub">Blog Admin</div>
    </div>
  </div>
  <nav class="sb-nav">
    <a href="dashboard.html" class="sb-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="editor.html" class="sb-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      New Post
    </a>
    <a href="../blog.html" target="_blank" class="sb-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      View Blog
    </a>
  </nav>
  <div class="sb-bottom">
    <div class="sb-user">Logged in as<strong id="userEmail">—</strong></div>
    <button class="sb-logout" onclick="doLogout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <h2>All Posts</h2>
    <a href="editor.html" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New Post
    </a>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">Total Posts</div></div>
    <div class="stat-card"><div class="num" id="statPublished">—</div><div class="lbl">Published</div></div>
    <div class="stat-card"><div class="num" id="statDraft">—</div><div class="lbl">Drafts</div></div>
  </div>

  <!-- Posts table -->
  <div class="table-card">
    <div class="table-head">
      <h3>Posts</h3>
      <input class="search-input" type="search" placeholder="Search posts…" id="searchInput" oninput="filterPosts()"/>
    </div>
    <div id="tableBody">
      <div class="loading">Loading posts…</div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL='https://fogkdxevecwnqbmezdnu.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZ2tkeGV2ZWN3bnFibWV6ZG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NDg0NzgsImV4cCI6MjA4NTUyNDQ3OH0.Gy8nDxKZFvPHrp2-r7bQILCn-zl0QmH5bb52tIVDOv0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allPosts=[];

// Auth check
sb.auth.getSession().then(({data:{session}})=>{
  if(!session){location.href='index.html';return;}
  document.getElementById('userEmail').textContent=session.user.email;
  loadPosts();
});

async function loadPosts(){
  const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('tableBody').innerHTML='<div class="empty">Error loading posts.</div>';return;}
  allPosts=data||[];
  renderStats();
  renderTable(allPosts);
}

function renderStats(){
  const pub=allPosts.filter(p=>p.status==='published').length;
  document.getElementById('statTotal').textContent=allPosts.length;
  document.getElementById('statPublished').textContent=pub;
  document.getElementById('statDraft').textContent=allPosts.length-pub;
}

function renderTable(posts){
  const el=document.getElementById('tableBody');
  if(!posts.length){
    el.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No posts yet. <a href="editor.html" style="color:#0d6e7a;font-weight:600;">Create your first post →</a></p></div>`;
    return;
  }
  el.innerHTML=`<table>
    <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody>${posts.map(p=>`
    <tr>
      <td><div class="post-title">${p.title||'Untitled'}</div><div class="post-date">/${p.slug}</div></td>
      <td>${p.category||'—'}</td>
      <td><span class="badge badge-${p.status}">${p.status}</span></td>
      <td class="post-date">${formatDate(p.created_at)}</td>
      <td><div class="actions">
        <a href="editor.html?id=${p.id}" class="btn btn-sm btn-outline">Edit</a>
        ${p.status==='draft'
          ?`<button class="btn btn-sm btn-success" onclick="toggleStatus('${p.id}','published')">Publish</button>`
          :`<button class="btn btn-sm btn-warn" onclick="toggleStatus('${p.id}','draft')">Unpublish</button>`}
        <button class="btn btn-sm btn-danger" onclick="deletePost('${p.id}','${(p.title||'').replace(/'/g,"\\'")}')">Delete</button>
      </div></td>
    </tr>`).join('')}
    </tbody></table>`;
}

function filterPosts(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  renderTable(allPosts.filter(p=>(p.title||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)));
}

async function toggleStatus(id,status){
  const update={status};
  if(status==='published') update.published_at=new Date().toISOString();
  const {error}=await sb.from('posts').update(update).eq('id',id);
  if(!error) loadPosts();
}

async function deletePost(id,title){
  if(!confirm(`Delete "${title}"?\nThis cannot be undone.`)) return;
  const {error}=await sb.from('posts').delete().eq('id',id);
  if(!error) loadPosts();
}

async function doLogout(){
  await sb.auth.signOut();
  location.href='index.html';
}

function formatDate(d){
  if(!d)return'—';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
</script>
</body>
</html>
